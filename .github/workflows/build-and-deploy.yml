name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001

      - name: Verify build output
        run: |
          test -d .next/standalone && echo "Standalone build OK"
          grep -q "Budapest" .next/server/app/index.html && echo "Budapest content verified"
        working-directory: frontend
